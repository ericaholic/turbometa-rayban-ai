# Build an UNSIGNED TurboMeta IPA on a cloud macOS runner (no local Mac needed).
# After the run, download the "TurboMeta-unsigned-ipa" artifact and sideload it
# with SideStore (signs with your own Apple ID on-device).
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build (unsigned)
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
        run: |
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            META_APP_ID="$META_APP_ID" CLIENT_TOKEN="$CLIENT_TOKEN" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -r TurboMeta-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TurboMeta-unsigned-ipa
          path: TurboMeta-unsigned.ipa
